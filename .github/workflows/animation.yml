name: Render Animation Episode

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode to render"
        required: true
        default: "episode_001"
        type: choice
        options:
          - episode_001

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender 4.5.16 LTS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils ffmpeg espeak-ng libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1 libegl-mesa0
          BLENDER_ARCHIVE="$RUNNER_TEMP/blender-4.5.16-linux-x64.tar.xz"
          BLENDER_DIR="$RUNNER_TEMP/blender"
          curl -fL --retry 3 --retry-delay 2 \
            "https://download.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz" \
            -o "$BLENDER_ARCHIVE"
          mkdir -p "$BLENDER_DIR"
          tar -xJf "$BLENDER_ARCHIVE" --strip-components=1 -C "$BLENDER_DIR"
          "$BLENDER_DIR/blender" --background --factory-startup --version
          echo "BLENDER_BIN=$BLENDER_DIR/blender" >> "$GITHUB_ENV"

      - name: Generate Arabic dialogue and audio bed
        run: python3 python/audio_production.py

      - name: Render silent animation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          "$BLENDER_BIN" --background --factory-startup \
            -P blender/animation_project.py -- \
            --output "output/${{ inputs.episode }}_silent.mp4"

      - name: Mux audio into final MP4
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i "output/${{ inputs.episode }}_silent.mp4" \
            -i output/episode_001_audio.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k \
            -shortest "output/${{ inputs.episode }}.mp4"
          test -s "output/${{ inputs.episode }}.mp4"
          ls -lh output/

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-animation-episode
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14
